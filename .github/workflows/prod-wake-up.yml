name: Prod - Wake Render API

on:
  workflow_dispatch:
  repository_dispatch:
    types: [prod-wake-render-api]

jobs:
  call-api:
    runs-on: ubuntu-latest

    steps:
      - name: Call health endpoint
        run: |
          curl --fail-with-body \
            --show-error \
            --silent \
            --max-time 120 \
            -H "X-API-Key: ${{ secrets.EXTERNAL_SYNC_API_KEY }}" \
            https://api.eplpredict.com/health/live