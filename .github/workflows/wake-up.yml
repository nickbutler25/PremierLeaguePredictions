name: Wake Render API

on:
  workflow_dispatch:

jobs:
  call-api:
    runs-on: ubuntu-latest

    steps:
      - name: Call health endpoint
        run: |
          curl --fail-with-body \
            --show-error \
            --silent \
            --max-time 120 \
            -H "X-API-Key: ${{ secrets.EXTERNAL_SYNC_API_KEY }}" \
            https://premierleague-api-dev.onrender.com/health/live
